name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish to npm
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate toolchain and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm_version="$(npm --version)"
          node --eval 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$npm_version"
          package_version="$(node -p "require('./packages/dsh-data-analysis/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          case "$package_version" in
            *-*) exit 1 ;;
          esac

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run release checks
        run: |
          npm run check
          npm run build
          npm run verify:plugin-package

      - name: Build npm tarball
        run: node scripts/pack-plugin.mjs

      - name: Publish with npm Trusted Publishing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm publish "artifacts/npm/chengxianglibra-dsh-data-analysis-${RELEASE_TAG#v}.tgz" --access public --tag latest

      - name: Attach published tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "artifacts/npm/chengxianglibra-dsh-data-analysis-${RELEASE_TAG#v}.tgz"
